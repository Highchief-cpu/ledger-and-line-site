<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger &amp; Line — Design and copy for brands that mean it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --ink:#141311;
    --ink-soft:#68645A;
    --violet:#6C56F0;
    --violet-deep:#4B39C4;
    --lime:#D8FF5C;
    --card:#FFFFFF;
    --border:#E6E0D2;
    --dark:#141311;
    --radius-lg:28px;
    --radius-md:16px;
    --radius-sm:999px;
    --max:1200px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Sora', sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    margin:0;
    letter-spacing:-0.015em;
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 32px; position:relative;}
  section{padding:110px 0;}
  @media (max-width:720px){
    section{padding:64px 0;}
    .wrap{padding:0 20px;}
  }

  .chip{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:600;
    padding:6px 14px; border-radius:var(--radius-sm);
    border:1.5px solid var(--ink);
    background:var(--card);
  }
  .chip.lime{background:var(--lime); border-color:var(--ink);}

  /* NAV */
  nav{
    position:sticky; top:0; z-index:50;
    padding:18px 0;
  }
  nav .nav-inner{
    max-width:var(--max); margin:0 auto; padding:0 32px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .nav-pill{
    display:flex; align-items:center; justify-content:space-between;
    width:100%;
    background:rgba(246,243,236,0.75);
    backdrop-filter:blur(14px);
    border:1.5px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px 12px 10px 22px;
    position:relative;
  }
  .nav-mark{font-family:'Space Grotesk', sans-serif; font-size:19px; font-weight:700;}
  .nav-links{display:flex; gap:28px; font-size:14.5px; font-weight:500;}
  .nav-links a{text-decoration:none; color:var(--ink-soft); transition:color .2s;}
  .nav-links a:hover{color:var(--ink);}
  .nav-cta{
    font-size:14px; font-weight:600; text-decoration:none; color:var(--paper);
    background:var(--ink); padding:11px 20px; border-radius:var(--radius-sm);
    white-space:nowrap;
  }
  .nav-burger{
    display:none;
    background:none; border:none; cursor:pointer;
    padding:8px; margin-right:4px;
    flex-direction:column; gap:5px; align-items:center; justify-content:center;
  }
  .nav-burger span{
    display:block; width:20px; height:2px; background:var(--ink);
    transition:transform .25s ease, opacity .2s ease;
  }
  .nav-burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .nav-burger.open span:nth-child(2){opacity:0;}
  .nav-burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

  .nav-mobile-panel{
    display:none;
    flex-direction:column;
    background:var(--paper);
    border:1.5px solid var(--border);
    border-radius:var(--radius-lg);
    margin-top:10px;
    padding:14px;
    position:absolute;
    left:0; right:0; top:100%;
  }
  .nav-mobile-panel a{
    text-decoration:none; color:var(--ink);
    font-family:'Space Grotesk', sans-serif; font-weight:500; font-size:18px;
    padding:14px 10px; border-bottom:1px solid var(--border);
  }
  .nav-mobile-panel.open{display:flex;}

  @media (max-width:820px){
    .nav-links{display:none;}
    .nav-burger{display:flex;}
    .nav-cta{display:none;}
  }

  /* HERO */
  .hero{
    padding-top:64px; padding-bottom:60px;
    position:relative;
  }
  .blob{
    position:absolute; z-index:-1; border-radius:50%;
